<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" font-family="Inter, system-ui, sans-serif">
  <text x="640" y="42" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">L'IA défensive fait baisser le coût d'une violation</text>
  <text x="640" y="68" font-size="13" fill="#64748b" text-anchor="middle">IBM — Cost of a Data Breach Report 2025 · coût moyen par violation</text>

  <!-- baseline -->
  <line x1="200" y1="440" x2="1080" y2="440" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Sans IA : 5,52 M$ -->
  <g>
    <rect x="330" y="130" width="200" height="310" rx="8" fill="#ef4444"/>
    <text x="430" y="115" font-size="32" font-weight="800" fill="#b91c1c" text-anchor="middle">5,52 M$</text>
    <text x="430" y="468" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">Sans IA / automatisation</text>
  </g>

  <!-- Avec IA : 3,62 M$ -->
  <g>
    <rect x="750" y="240" width="200" height="200" rx="8" fill="#34d399"/>
    <text x="850" y="225" font-size="32" font-weight="800" fill="#047857" text-anchor="middle">3,62 M$</text>
    <text x="850" y="468" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">Avec IA + automatisation</text>
  </g>

  <!-- delta bracket -->
  <g>
    <line x1="530" y1="180" x2="750" y2="180" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="560" y="150" width="160" height="46" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="640" y="180" font-size="22" font-weight="800" fill="#b45309" text-anchor="middle">− 1,9 M$</text>
  </g>

  <!-- footer note -->
  <text x="640" y="510" font-size="14" fill="#64748b" text-anchor="middle">+ détection 80 jours plus rapide · mais « shadow AI » ajoute 670 000 $ par violation</text>
</svg>
