<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" font-family="Inter, system-ui, sans-serif">
  <text x="640" y="42" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">Un SI résilient : la convergence de trois plans</text>
  <text x="640" y="68" font-size="13" fill="#64748b" text-anchor="middle">Aucun plan ne suffit seul — la résilience naît de leur combinaison</text>

  <!-- triangle -->
  <polygon points="640,120 320,430 960,430" fill="none" stroke="#cbd5e1" stroke-width="2"/>

  <!-- center label -->
  <circle cx="640" cy="330" r="70" fill="#0f172a"/>
  <text x="640" y="322" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">SI</text>
  <text x="640" y="346" font-size="18" font-weight="800" fill="#f59e0b" text-anchor="middle">RÉSILIENT</text>

  <!-- Vertex 1 : Technique (top) -->
  <g>
    <circle cx="640" cy="120" r="14" fill="#3b82f6"/>
    <rect x="470" y="88" width="340" height="64" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="640" y="112" font-size="17" font-weight="800" fill="#1d4ed8" text-anchor="middle">⚙️ TECHNIQUE</text>
    <text x="640" y="134" font-size="12" fill="#334155" text-anchor="middle">Zero Trust · SOC/IA (SIEM-SOAR-XDR) · MLSecOps · PRA-PCA</text>
  </g>

  <!-- Vertex 2 : Organisationnel (bottom-left) -->
  <g>
    <circle cx="320" cy="430" r="14" fill="#f59e0b"/>
    <rect x="120" y="440" width="360" height="66" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="300" y="464" font-size="17" font-weight="800" fill="#b45309" text-anchor="middle">🏛️ ORGANISATIONNEL</text>
    <text x="300" y="486" font-size="12" fill="#334155" text-anchor="middle">Gouvernance (RSSI/DPO) · EBIOS RM · AIPD</text>
    <text x="300" y="501" font-size="12" fill="#334155" text-anchor="middle">formation · culture de crise · RACI</text>
  </g>

  <!-- Vertex 3 : Juridique (bottom-right) -->
  <g>
    <circle cx="960" cy="430" r="14" fill="#34d399"/>
    <rect x="800" y="440" width="360" height="66" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
    <text x="980" y="464" font-size="17" font-weight="800" fill="#047857" text-anchor="middle">⚖️ JURIDIQUE</text>
    <text x="980" y="486" font-size="12" fill="#334155" text-anchor="middle">NIS2 · DORA · AI Act · RGPD</text>
    <text x="980" y="501" font-size="12" fill="#334155" text-anchor="middle">conformité · clauses fournisseurs (art. 28)</text>
  </g>

  <!-- connecting spokes -->
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.7">
    <line x1="640" y1="134" x2="640" y2="260"/>
    <line x1="390" y1="415" x2="585" y2="360"/>
    <line x1="890" y1="415" x2="695" y2="360"/>
  </g>
</svg>
